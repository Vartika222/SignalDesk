[project]
name = "signaldesk"
version = "0.1.0"
description = "Cited signals from SEC filings, with honest evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "transformers>=4.46",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "matplotlib>=3.9",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "jupytext>=1.16",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "tabulate>=0.9",
]

[project.scripts]
signaldesk = "signaldesk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signaldesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running Postgres (make up)",
    "models: downloads and runs embedding models",
]

[tool.ruff]
line-length = 112
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) in defaults is the typer idiom

[tool.ruff.lint.per-file-ignores]
# Notebook cells end in bare expressions to display them, and import where they're used.
"notebooks/*.py" = ["B018", "E402", "E501"]
