name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: cd ingest && go vet ./... && go test ./...

  python:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: signaldesk
          POSTGRES_PASSWORD: signaldesk
          POSTGRES_DB: signaldesk
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U signaldesk" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://signaldesk:signaldesk@localhost:5433/signaldesk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --python 3.12
      - run: uv run ruff check src tests notebooks scripts
      - run: uv run signaldesk db migrate
      - run: uv run pytest -q
