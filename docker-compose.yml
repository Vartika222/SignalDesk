services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: signaldesk-db
    environment:
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
      POSTGRES_DB: signaldesk
    ports:
      - "5433:5432" # 5433 so it never collides with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
